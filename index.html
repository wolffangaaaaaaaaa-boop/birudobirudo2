<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビルドシミュレーター</title>
<style>
*{box-sizing:border-box}
:root{
  --indigo:#4f46e5; --indigo-dark:#3730a3; --indigo-light:#eef2ff;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0;
  --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b;
  --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --emerald:#059669; --red:#dc2626;
}
html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--slate-800)}
body{background:var(--slate-100)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}
.panel{overflow-y:auto}
.left{width:25%;background:white;box-shadow:0 2px 8px #00000012;padding:24px;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;position:relative;z-index:10}
.center{width:50%;background:var(--slate-50);padding:24px;overflow-y:auto}
.right{width:25%;background:var(--slate-900);padding:24px;overflow-y:auto;color:#f8fafc;display:flex;flex-direction:column}
.brand{display:flex;gap:9px;align-items:center;margin-bottom:24px;border-bottom:1px solid var(--slate-200);padding-bottom:9px;color:#312e81}
.brand h2{font-size:20px;margin:0}
.section{margin-bottom:24px}
.section h3{font-size:14px;margin:0 0 9px;font-weight:700;color:var(--slate-700)}
select,.stat-input{width:100%;padding:10px;border:1px solid var(--slate-300);border-radius:9px;background:var(--slate-50);outline:none}
select:focus,.stat-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #818cf822}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat label{display:block;font-size:12px;color:var(--slate-500);margin-bottom:4px}
.stat-input{text-align:right;padding:8px}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.book{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--slate-700)}
.book input{accent-color:var(--indigo);width:17px;height:17px}
.bottom-action{margin-top:auto;padding-top:24px;border-top:1px solid var(--slate-100)}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;transition:.15s}
.btn.primary{background:var(--indigo);color:#fff}.btn.primary:hover{background:var(--indigo-dark)}
.btn.secondary{width:100%;background:var(--indigo-light);color:#4338ca;border:1px solid #c7d2fe}.btn.secondary:hover{background:#e0e7ff}
.header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--slate-200);padding:8px 0 10px;margin-bottom:24px;position:sticky;top:0;background:#f8fafce8;backdrop-filter:blur(8px);z-index:5}
.header h2{font-size:20px;margin:0}
.count{font-size:13px;font-weight:600;color:var(--slate-500);background:white;padding:5px 12px;border:1px solid var(--slate-200);border-radius:999px}
.category{margin-bottom:30px}
.category-title{font-size:15px;color:var(--slate-700);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--slate-200)}
.skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.skill-card{background:white;border:1px solid var(--slate-200);border-radius:10px;padding:14px;box-shadow:0 1px 2px #00000008}
.skill-card.equipped{border-color:#818cf8;background:#eef2ff55}
.skill-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.skill-name{font-weight:800;color:#312e81;font-size:15px}
.set-badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:#e0e7ff;color:#4338ca;white-space:nowrap}
.trigger{display:inline-block;font-size:11px;font-weight:700;color:#4f46e5;background:#eef2ff;padding:3px 6px;border-radius:5px;margin:8px 0}
.effect{font-size:13px;color:var(--slate-600);line-height:1.55;min-height:40px}
.skill-card button{width:100%;margin-top:14px;padding:8px;border-radius:8px;border:1px solid transparent;font-weight:800;font-size:13px}
.skill-card button.add{background:var(--indigo);color:#fff}.skill-card button.add:hover{background:var(--indigo-dark)}
.skill-card button.remove{background:var(--slate-100);color:var(--slate-600)}.skill-card button.remove:hover{background:#fef2f2;color:var(--red);border-color:#fecaca}
.skill-card button:disabled{background:var(--slate-100);color:var(--slate-400);cursor:not-allowed;opacity:.6}
.empty{text-align:center;padding:80px 20px;color:var(--slate-400);line-height:1.8}
.right-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--slate-700);padding:8px 0 12px;margin-bottom:16px;position:sticky;top:0;background:#0f172ae8;backdrop-filter:blur(8px);z-index:5}
.right-header h2{font-size:18px;margin:0;color:white}
.slot-count{font-size:13px;font-weight:800;padding:5px 8px;border-radius:6px;background:var(--slate-800);color:#cbd5e1}
.slot-count.full{background:#6366f1;color:#fff}
.slots{display:flex;flex-direction:column;gap:8px;flex:1}
.slot{min-height:58px;border:1px dashed #334155;background:#1e293c;border-radius:9px;padding:11px;display:flex;align-items:center;justify-content:center}
.slot-num{color:#475569;font-size:11px;font-weight:800;letter-spacing:1px}
.equipped-slot{position:relative;background:#1e293b;border:1px solid #334155;border-radius:9px;padding:11px;min-height:58px}
.equipped-slot:hover{border-color:#64748b}
.equipped-slot .name{font-weight:800;color:#a5b4fc;font-size:13px;padding-right:30px}
.equipped-slot .effect{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;margin-top:3px}
.remove-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#64748b;font-size:20px;padding:3px}.remove-x:hover{color:#f87171}
.clear{margin-top:18px;padding-top:16px;border-top:1px solid #1e293b;position:sticky;bottom:0;background:var(--slate-900);padding-bottom:4px}
.clear button{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;font-weight:800}.clear button:hover:not(:disabled){background:#7f1d1d33;color:#f87171;border-color:#ef444480}.clear button:disabled{opacity:.45;cursor:not-allowed}
.mobile-summary{display:none}
.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:white;border-radius:14px;width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px #0004}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--slate-200);background:var(--slate-50);border-radius:14px 14px 0 0}
.modal-head h2{margin:0;font-size:20px}.close{border:0;background:transparent;color:var(--slate-400);font-size:24px}
.modal-body{padding:24px;overflow:auto;background:var(--slate-100)}
.summary-grid{display:grid;grid-template-columns:1fr 2fr;gap:24px}
.summary-box{background:white;border:1px solid var(--slate-200);border-radius:9px;padding:16px;box-shadow:0 1px 2px #00000008;margin-bottom:16px}
.summary-box h3{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--slate-200)}
.row{display:flex;justify-content:space-between;align-items:center;margin:7px 0;font-size:13px}
.tag{background:#eef2ff;color:#4338ca;padding:2px 7px;border-radius:5px;font-weight:700}.book-tag{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;padding:4px 7px;border-radius:6px;font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.summary-skills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-skill{padding:11px;border:1px solid #e0e7ff;background:#eef2ff55;border-radius:7px}.summary-skill b{color:#312e81;font-size:13px}.summary-skill div{font-size:11px;color:var(--slate-500);margin-top:3px}.summary-skill span{font-size:11px;color:var(--slate-700)}
.modal-foot{padding:16px;border-top:1px solid var(--slate-200);display:flex;justify-content:flex-end}
@media(max-width:900px){
  .app{height:auto;min-height:100vh;display:block;overflow:visible}
  .left,.center,.right{width:100%;overflow:visible}
  .left{border-right:0}
  .right{display:none}
  .skill-grid{grid-template-columns:1fr}
  .mobile-summary{display:flex;position:fixed;right:20px;bottom:20px;z-index:40;width:54px;height:54px;border:0;border-radius:50%;background:var(--indigo);color:white;align-items:center;justify-content:center;box-shadow:0 8px 25px #0003;font-size:22px}
  .summary-grid{grid-template-columns:1fr}
}
@media(min-width:901px) and (max-width:1200px){.skill-grid{grid-template-columns:1fr}}
</style>
</head>

let stats = {atk:0, agi:0, dex:0, vit:0, mnd:0, luk:0};
let books = [];
let equipped = [];
let modalOpen = false;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getLearnable = () => SKILLS.filter(skill => {
  const r = skill.req || {};
  if (r.type === "none") return true;
  if (r.type === "role") return role === r.role;
  if (r.type === "stat") return stats[r.stat] >= r.val;
  if (r.type === "multiStat") return Object.entries(r.stats).every(([k,v]) => stats[k] >= v);
  if (r.type === "book") return books.includes(r.book) && (!r.role || r.role === role);
  return false;
});

function setStat(k,v){ stats[k] = Math.max(0, parseInt(v,10) || 0); render(); }
function toggleBook(b){ books = books.includes(b) ? books.filter(x=>x!==b) : [...books,b]; render(); }
function removeSkill(name){ equipped = equipped.filter(s=>s.name!==name); render(); }
function toggleSkill(skill){
  if(equipped.some(s=>s.name===skill.name)){ removeSkill(skill.name); return; }
  if(equipped.length >= 12) return;
  equipped = [...equipped, skill];
  render();
}
function openModal(){modalOpen=true; renderModal();}
function closeModal(){modalOpen=false; renderModal();}

function render(){
  const learnable = getLearnable();

        </select>
      </div>
      <div class="section">
        <h3>ステータス</h3>
        <div class="stat-grid">
          ${Object.keys(STATS_LABEL).map(k=>`

            </div>`).join("")}
        </div>
      </div>
      <div class="section">
        <h3>スキルブック</h3>
        <div class="book-grid">
          ${BOOK_LIST.map(b=>`<label class="book"><input type="checkbox" data-book="${esc(b)}" ${books.includes(b)?"checked":""}><span>${esc(b)}</span></label>`).join("")}

      </div>
      <div class="bottom-action">
        <button class="btn secondary" id="summary-btn">☷　現在のビルドを確認する</button>
      </div>

    <main class="center panel">
      <div class="header"><h2>習得可能なスキル</h2><span class="count">${learnable.length} 件</span></div>
      ${Object.entries(CATEGORIES).map(([key,name])=>{
        const list=groups[key];
        if(!list.length) return "";
        return `<section class="category"><h3 class="category-title">${name}</h3>
          <div class="skill-grid">${list.map(skillCard).join("")}</div></section>`;
      }).join("")}
      ${!learnable.length ? `<div class="empty">ⓘ<br>条件を満たすスキルがありません。<br>左のパネルからステータス等を設定してください。</div>` : ""}
    </main>

    <aside class="right panel">
      <div class="right-header"><h2>セットしたスキル</h2><span class="slot-count ${equipped.length===12?"full":""}">${equipped.length} / 12</span></div>
      <div class="slots">${Array.from({length:12},(_,i)=>{
        const s=equipped[i];
        return s ? `<div class="equipped-slot"><div class="name">${esc(s.name)}</div><div class="effect">${esc(s.effect)}</div><button class="remove-x" data-remove="${esc(s.name)}" title="解除する">×</button></div>`
                  : `<div class="slot"><span class="slot-num">SLOT ${i+1}</span></div>`;
      }).join("")}</div>
      <div class="clear"><button id="clear-btn" ${equipped.length?"":"disabled"}>×　すべて外す</button></div>
    </aside>

    <button class="mobile-summary" id="mobile-summary" aria-label="現在のビルドを確認">☷</button>

  document.querySelectorAll("[data-book]").forEach(el=>el.onchange=()=>toggleBook(el.dataset.book));

  document.getElementById("mobile-summary").onclick=openModal;
}

function skillCard(skill){
  const isEquipped=equipped.some(s=>s.name===skill.name);
  const full=!isEquipped && equipped.length>=12;
  return `<div class="skill-card ${isEquipped?"equipped":""}">
    <div class="skill-top"><div class="skill-name">${esc(skill.name)}</div>${isEquipped?'<span class="set-badge">✓ セット中</span>':""}</div>

    <button class="${isEquipped?"remove":"add"}" data-skill="${esc(skill.name)}" ${full?"disabled":""}>${isEquipped?"外す":"セットする"}</button>
  </div>`;
}

              <div class="row"><span>ロール</span><span class="tag">${esc(role||"未設定")}</span></div>
              <div style="font-size:13px;color:#64748b;margin:16px 0 7px">選択中のスキルブック</div>
              ${books.length?`<div class="tags">${books.map(b=>`<span class="book-tag">${esc(b)}</span>`).join("")}</div>`:'<span style="font-size:13px;color:#94a3b8;font-style:italic">なし</span>'}
            </div>
            <div class="summary-box"><h3>ステータス</h3>
              ${Object.entries(STATS_LABEL).map(([k,l])=>`<div class="row"><span style="color:#64748b">${l}</span><b style="background:#f1f5f9;padding:2px 7px;border-radius:5px">${stats[k]}</b></div>`).join("")}
            </div>
          </div>
          <div class="summary-box" style="margin-bottom:0"><h3 style="display:flex;justify-content:space-between">セットしたスキル <span class="tag">${equipped.length} / 12 枠</span></h3>
            ${equipped.length?`<div class="summary-skills">${equipped.map(s=>`<div class="summary-skill"><b>${esc(s.name)}</b><div>${esc(s.trigger)}</div><span>${esc(s.effect)}</span></div>`).join("")}</div>`:`<div class="empty" style="padding:50px 10px">ⓘ<br>スキルがセットされていません</div>`}
          </div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn primary" id="close-modal-2">閉じる</button></div>
    </div>
  </div>`;
  document.getElementById("close-modal").onclick=closeModal;
  document.getElementById("close-modal-2").onclick=closeModal;
  document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal();};
}
render();
</script>
</body>
</html>
