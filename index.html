<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビルドシミュレーター</title>
<style>
*{box-sizing:border-box}
:root{
  --indigo:#4f46e5; --indigo-dark:#3730a3; --indigo-light:#eef2ff;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0;
  --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b;
  --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --emerald:#059669; --emerald-light:#ecfdf5; --red:#dc2626; --amber:#d97706;
}
html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--slate-800)}
body{background:var(--slate-100)}
button,input,select{font:inherit}
button{cursor:pointer}

.app{display:flex;height:100vh;overflow:hidden}
.panel{overflow-y:auto}
.left{width:26%;background:white;box-shadow:0 2px 8px #00000012;padding:24px;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;position:relative;z-index:10}
.center{width:49%;background:var(--slate-50);padding:24px;overflow-y:auto}
.right{width:25%;background:var(--slate-900);padding:24px;overflow-y:auto;color:#f8fafc;display:flex;flex-direction:column}
.brand{display:flex;gap:9px;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--slate-200);padding-bottom:12px;color:#312e81}
.brand h2{font-size:20px;margin:0;font-weight:800}

.pt-card{
  background:linear-gradient(135deg, #312e81 0%, #4f46e5 100%);
  color:white;
  padding:14px 16px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 4px 14px rgba(79, 70, 229, 0.25);
}
.pt-card-header{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  opacity:0.85;
  font-weight:700;
  margin-bottom:2px;
}
.pt-card-value{
  font-size:28px;
  font-weight:900;
  line-height:1.1;
  display:flex;
  align-items:baseline;
  gap:4px;
}
.pt-card-value span{
  font-size:14px;
  font-weight:700;
  opacity:0.9;
}
.pt-card-details{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,0.2);
  display:flex;
  justify-content:space-between;
  font-size:11px;
  opacity:0.95;
}
.pt-card-details div span{
  font-weight:700;
}

.section{margin-bottom:20px}
.section h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--slate-600);text-transform:uppercase;letter-spacing:0.5px}
select,.stat-input,.search-input{width:100%;padding:9px 12px;border:1px solid var(--slate-300);border-radius:8px;background:var(--slate-50);outline:none;transition:all 0.15s}
select:focus,.stat-input:focus,.search-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #818cf822;background:white}
.role-grid{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat label{display:block;font-size:12px;color:var(--slate-500);margin-bottom:3px;font-weight:600}
.stat-input{text-align:right}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.book{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--slate-700);padding:6px 8px;border-radius:6px;border:1px solid var(--slate-200);background:white;transition:0.15s}
.book:hover{background:var(--slate-50)}
.book input{accent-color:var(--indigo);width:16px;height:16px}
.bottom-action{margin-top:auto;padding-top:16px;border-top:1px solid var(--slate-200)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--indigo);color:#fff}.btn.primary:hover{background:var(--indigo-dark)}
.btn.secondary{width:100%;background:var(--indigo-light);color:#4338ca;border:1px solid #c7d2fe}.btn.secondary:hover{background:#e0e7ff}
.btn.outline{background:white;color:var(--slate-700);border:1px solid var(--slate-300)}.btn.outline:hover{background:var(--slate-50)}

.header{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--slate-200);padding:0 0 16px;margin-bottom:20px;position:sticky;top:0;background:#f8fafce8;backdrop-filter:blur(8px);z-index:5}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h2{font-size:20px;margin:0;font-weight:800}
.count{font-size:12px;font-weight:700;color:var(--slate-600);background:white;padding:4px 12px;border:1px solid var(--slate-200);border-radius:999px}
.category{margin-bottom:28px}
.category-title{font-size:14px;color:var(--slate-700);margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--slate-200);font-weight:800;display:flex;align-items:center;justify-content:space-between}
.skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.skill-card{background:white;border:1px solid var(--slate-200);border-radius:10px;padding:14px;box-shadow:0 1px 3px #00000008;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.1s, border-color 0.15s}
.skill-card:hover{border-color:var(--slate-300)}
.skill-card.equipped{border-color:#818cf8;background:#eef2ff44;box-shadow:0 0 0 1px #818cf8}
.skill-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.skill-name{font-weight:800;color:#1e1b4b;font-size:15px}
.req-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--slate-100);color:var(--slate-600);border:1px solid var(--slate-200);white-space:nowrap}
.set-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e0e7ff;color:#4338ca;white-space:nowrap}
.trigger{display:inline-block;font-size:11px;font-weight:700;color:#4f46e5;background:#eef2ff;padding:3px 7px;border-radius:5px;margin:8px 0;width:fit-content}
.effect{font-size:13px;color:var(--slate-600);line-height:1.5;min-height:38px;margin-bottom:8px}
.skill-card button{width:100%;margin-top:auto;padding:8px;border-radius:8px;border:1px solid transparent;font-weight:700;font-size:13px;transition:0.15s}
.skill-card button.add{background:var(--indigo);color:#fff}.skill-card button.add:hover{background:var(--indigo-dark)}
.skill-card button.remove{background:white;color:var(--red);border-color:#fca5a5}.skill-card button.remove:hover{background:#fef2f2}
.skill-card button:disabled{background:var(--slate-100);color:var(--slate-400);border-color:transparent;cursor:not-allowed;opacity:.7}
.empty{text-align:center;padding:60px 20px;color:var(--slate-400);line-height:1.8;background:white;border-radius:12px;border:1px dashed var(--slate-300)}

.right-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--slate-700);padding:0 0 12px;margin-bottom:16px;position:sticky;top:0;background:#0f172ae8;backdrop-filter:blur(8px);z-index:5}
.right-header h2{font-size:17px;margin:0;color:white;font-weight:800}
.slot-subtext{font-size:11px;color:#94a3b8;margin-top:2px;font-weight:600}
.slot-count{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--slate-800);color:#cbd5e1;border:1px solid #334155}
.slot-count.full{background:#6366f1;color:#fff;border-color:#818cf8}
.slots{display:flex;flex-direction:column;gap:8px;flex:1}
.slot{min-height:54px;border:1px dashed #334155;background:#1e293c44;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between}
.slot-num{color:#475569;font-size:11px;font-weight:800;letter-spacing:1px}
.slot-cost-tag{font-size:10px;color:#64748b;font-weight:700}
.slot-cost-tag.extra{color:#818cf8}
.equipped-slot{position:relative;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 36px 10px 12px;min-height:54px;transition:0.15s}
.equipped-slot:hover{border-color:#64748b}
.equipped-slot .name-box{display:flex;align-items:center;justify-content:space-between;padding-right:8px}
.equipped-slot .name{font-weight:800;color:#a5b4fc;font-size:13px}
.equipped-slot .slot-cost{font-size:10px;font-weight:700;color:#94a3b8;background:#334155;padding:1px 6px;border-radius:4px}
.equipped-slot .effect{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;margin-top:2px}
.remove-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#64748b;font-size:20px;padding:4px;cursor:pointer;line-height:1;border-radius:4px}.remove-x:hover{color:#f87171;background:#334155}
.clear{margin-top:16px;padding-top:16px;border-top:1px solid #1e293b;position:sticky;bottom:0;background:var(--slate-900);padding-bottom:4px}
.clear button{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;font-weight:700}.clear button:hover:not(:disabled){background:#7f1d1d33;color:#f87171;border-color:#ef444480}.clear button:disabled{opacity:.4;cursor:not-allowed}

.mobile-summary{display:none}
.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:white;border-radius:14px;width:min(950px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px #0004;overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--slate-200);background:var(--slate-50)}
.modal-head h2{margin:0;font-size:18px;font-weight:800}.close{border:0;background:transparent;color:var(--slate-400);font-size:24px;cursor:pointer}.close:hover{color:var(--slate-700)}

/* モーダル内タブ切り替えスタイル */
.modal-tabs{display:flex;background:var(--slate-200);padding:4px;border-radius:10px;margin-bottom:16px;gap:4px}
.tab-btn{flex:1;padding:10px 14px;border:0;background:transparent;font-size:13px;font-weight:800;color:var(--slate-600);border-radius:8px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn.active{background:white;color:var(--indigo);box-shadow:0 2px 6px rgba(0,0,0,0.08)}

.modal-body{padding:20px;overflow:auto;background:var(--slate-100);flex:1}
.summary-grid{display:grid;grid-template-columns:1fr 2fr;gap:16px}
.summary-box{background:white;border:1px solid var(--slate-200);border-radius:10px;padding:16px;box-shadow:0 1px 2px #00000008;margin-bottom:12px}
.summary-box h3{font-size:14px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--slate-200);font-weight:800;color:var(--slate-700)}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:13px}
.tag{background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px}.book-tag{background:var(--emerald-light);color:var(--emerald);border:1px solid #a7f3d0;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.summary-skills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-skill{padding:10px 12px;border:1px solid #e0e7ff;background:#eef2ff55;border-radius:8px}.summary-skill b{color:#312e81;font-size:13px;display:block}.summary-skill div{font-size:11px;color:var(--indigo);margin:2px 0 4px;font-weight:700}.summary-skill span{font-size:12px;color:var(--slate-600);line-height:1.4;display:block}

.sim-header-info{background:white;border:1px solid var(--slate-200);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--slate-600);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sim-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim-table-container{background:white;border:1px solid var(--slate-200);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #00000008}
.sim-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
.sim-table th{background:var(--slate-100);color:var(--slate-700);padding:10px 12px;font-weight:800;border-bottom:1px solid var(--slate-200);position:sticky;top:0;z-index:2}
.sim-table td{padding:9px 12px;border-bottom:1px solid var(--slate-100);vertical-align:middle}
.sim-row{transition:background 0.1s}
.sim-row:hover{background:var(--slate-50)}
.sim-row.slv-up-row{background:#f0f9ff;border-top:2px solid #0284c7}
.sim-row.has-mult-4{background:#faf5ff}
.sim-row.has-mult-7{background:#f0fdf4}
.sim-row.has-mult-9{background:#fff7ed}

.mult-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;display:inline-block;margin-right:3px}
.mult-4{background:#f3e8ff;color:#7e22ce;border:1px solid #e9d5ff}
.mult-7{background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
.mult-9{background:#ffedd5;color:#c2410c;border:1px solid #fed7aa}

.slv-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-block}
.slv-0{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.slv-1{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.slv-2{background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe}
.slv-3{background:#fce7f3;color:#9d174d;border:1px solid #fbcfe8}

.slv-up-tag{font-size:10px;font-weight:900;background:#0284c7;color:white;padding:2px 6px;border-radius:4px;margin-left:4px;letter-spacing:0.5px}
.slot-badge{font-size:10px;font-weight:800;background:#334155;color:white;padding:2px 6px;border-radius:4px;margin-right:6px}
.no-skill{color:var(--slate-400);font-style:italic}

.modal-foot{padding:14px 20px;border-top:1px solid var(--slate-200);display:flex;justify-content:space-between;align-items:center;background:white}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:100;display:none}

@media(max-width:900px){
  .app{height:auto;min-height:100vh;display:block;overflow:visible}
  .left,.center,.right{width:100%;overflow:visible}
  .left{border-right:0}
  .right{display:none}
  .skill-grid{grid-template-columns:1fr}
  .mobile-summary{display:flex;position:fixed;right:20px;bottom:20px;z-index:40;width:56px;height:56px;border:0;border-radius:50%;background:var(--indigo);color:white;align-items:center;justify-content:center;box-shadow:0 8px 25px #0004;font-size:22px;font-weight:bold}
  .summary-grid{grid-template-columns:1fr}
  .summary-skills{grid-template-columns:1fr}
}
@media(min-width:901px) and (max-width:1200px){.skill-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
const SKILLS = [
  // --- 基本スキル ---

  {"name": "ウォール", "trigger": "SLv0以上 / 通常時", "req": {"type": "role", "role": "TANK", "minLv": 1}, "effect": "[味全]守増でなければ守増+[自]良性変調"},

  {"name": "バリプラス", "trigger": "ターン終了前", "req": {"type": "role", "role": "TANK", "minLv": 3}, "effect": "[味全]守増なら祝福+[乱味]守増でなければ加護"},

  {"name": "パシュート", "trigger": "与ダメ後", "req": {"type": "role", "role": "DPS", "minLv": 1}, "effect": "[敵]★攻撃＆次被ダメ増"},
  {"name": "ディセクト", "trigger": "SLv0以上 / 通常時", "req": {"type": "role", "role": "DPS", "minLv": 1}, "effect": "[弱敵]痛撃＆凍結"},
  {"name": "ディバイド", "trigger": "SLv0以上 / 通常時", "req": {"type": "role", "role": "DPS", "minLv": 1}, "effect": "[敵]疾撃+[敵]反撃"},
  {"name": "リッパー", "trigger": "SLv1以上 / 通常時", "req": {"type": "role", "role": "DPS", "minLv": 2}, "effect": "[弱敵]★痛撃＆凍結"},

const SLOT_COSTS = [0, 0, 0, 0, 0, 0, 35, 40, 45, 50, 60, 70];

// --- 時間経過によるステータスポイント配布 ---
const INITIAL_POINTS = 30;

// 通常配布の設定
const NORMAL_BASE_DATE_STR = "2026-09-12T18:00:00+09:00"; // 初回通常配布日時
const INCREASE_DATE_STR = "2026-09-26T00:00:00+09:00";    // 4ptに増加する日時（9月26日 0:00〜）
const NORMAL_DIST_HOURS = 12;
const EARLY_NORMAL_POINTS = 3;  // 9/26前の通常配布PT
const LATE_NORMAL_POINTS = 4;   // 9/26以降の通常配布PT

// ボーナス配布の設定
const BONUS_BASE_DATE_STR = "2026-09-12T06:00:00+09:00";  // 初回ボーナス配布日時（12日 朝6:00）
const BONUS_DIST_DAYS = 7;
const BONUS_DIST_POINTS = 20;

const calculateDistributedPoints = () => {
  const now = Date.now();
  const normalBaseDate = new Date(NORMAL_BASE_DATE_STR).getTime();
  const increaseDate = new Date(INCREASE_DATE_STR).getTime();
  const bonusBaseDate = new Date(BONUS_BASE_DATE_STR).getTime();

  const halfDayMs = NORMAL_DIST_HOURS * 60 * 60 * 1000;
  const weekMs = BONUS_DIST_DAYS * 24 * 60 * 60 * 1000;

  // --- 1. ボーナスポイントの計算 (12日 朝6時を起点に7日毎) ---
  let bonusDistributed = 0;
  if (now >= bonusBaseDate) {
    const bonusCount = Math.floor((now - bonusBaseDate) / weekMs) + 1;
    bonusDistributed = bonusCount * BONUS_DIST_POINTS;
  }

  // --- 2. 通常ポイントの計算 (9/26を境に3pt→4ptへ変更) ---
  let normalDistributed = 0;
  let nextUpdateMs = 0;
  let currentNormalPoints = EARLY_NORMAL_POINTS;

  if (now < normalBaseDate) {
    nextUpdateMs = normalBaseDate - now;
  } else {
    // 基準日時からの総配布回数 (12/18:00 を1回目とする)
    const normalCount = Math.floor((now - normalBaseDate) / halfDayMs) + 1;

    // 9/26より前に発生した配布回数を算出
    const countBeforeIncrease = Math.ceil((increaseDate - normalBaseDate) / halfDayMs);
    const earlyCount = Math.min(normalCount, Math.max(0, countBeforeIncrease));
    const lateCount = Math.max(0, normalCount - earlyCount);

    // 3pt時代と4pt時代の合計ポイント
    normalDistributed = (earlyCount * EARLY_NORMAL_POINTS) + (lateCount * LATE_NORMAL_POINTS);

    // 次回配布までの時間
    const timeSinceLastNormal = (now - normalBaseDate) % halfDayMs;
    nextUpdateMs = halfDayMs - timeSinceLastNormal;

    // 次回配布時に付与されるポイント数（次回配布日時が9/26以降なら4pt）
    const nextDistributionTime = now + nextUpdateMs;
    currentNormalPoints = (nextDistributionTime >= increaseDate) ? LATE_NORMAL_POINTS : EARLY_NORMAL_POINTS;
  }

  const distributed = normalDistributed + bonusDistributed;

  return {
    initial: INITIAL_POINTS,
    distributed,
    total: INITIAL_POINTS + distributed,
    nextUpdateMs,
    currentNormalPoints // 次回付与される通常ポイント数
  };
};

const getAvailablePoints = () => {
  const { total } = calculateDistributedPoints();
  const { totalPt } = getStatusPointSummary();
  return total - totalPt;
};

const formatPointTimeLeft = (ms) => {
  const totalSeconds = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return `${hours}時間${minutes}分 ${seconds}秒`;
};

const updatePointCard = () => {
  const card = document.getElementById("point-card");
  if (!card) return;

  const pts = calculateDistributedPoints();
  const { statSum, statPt, slotPt, totalPt } = getStatusPointSummary();
  const remaining = pts.total - totalPt;

  const remainingEl = document.getElementById("remaining-pt");
  const totalEl = document.getElementById("total-pt");
  const consumedEl = document.getElementById("consumed-pt");

  if (remainingEl) remainingEl.textContent = `${remaining} PT`;
  if (totalEl) totalEl.textContent = `${pts.total} PT`;
  if (consumedEl) consumedEl.textContent = `${totalPt} PT`;

  const detailEl = document.getElementById("point-detail");
  if (detailEl) {
    detailEl.textContent =
      `初期 ${pts.initial ?? INITIAL_POINTS} + 配布${pts.distributed} / ` +
      `ステータス ${statPt} + 枠${slotPt}`;
  }

  const nextEl = document.getElementById("next-point");
  if (nextEl) {
    nextEl.textContent = pts.nextUpdateMs > 0
      ? `次回通常配布 (+${pts.currentNormalPoints} PT) まで:${formatPointTimeLeft(pts.nextUpdateMs)}`
      : "配布開始をお待ちください";
  }
};

const calculateSlotCost = (slotCount) => {
  let cost = 0;
  for (let i = 0; i < slotCount; i++) {
    if (i < SLOT_COSTS.length) {
      cost += SLOT_COSTS[i];
    }
  }
  return cost;
};

const getStatusPointSummary = () => {
  const statSum = Object.values(stats).reduce((acc, curr) => acc + (curr || 0), 0);
  const statPt = statSum * 3;
  const slotPt = calculateSlotCost(equipped.length);
  const totalPt = statPt + slotPt;
  return { statSum, statPt, slotPt, totalPt };
};

const canAffordStatValue = (key, value) => {
  const nextValue = Math.max(0, parseInt(value, 10) || 0);
  const currentValue = stats[key] || 0;
  const deltaCost = (nextValue - currentValue) * 3;
  return getAvailablePoints() >= deltaCost;
};

const canAffordNextSlot = () => {
  const currentCost = calculateSlotCost(equipped.length);
  const nextCost = calculateSlotCost(equipped.length + 1);
  return getAvailablePoints() >= (nextCost - currentCost);
};

const formatReqText = (req) => {
  if (req.type === "none") return "条件なし";
  if (req.type === "role") return `${req.role} Lv${req.minLv || 1}`;
  if (req.type === "stat") return `${STATS_LABEL[req.stat]} ${req.val}`;
  if (req.type === "multiStat") return Object.entries(req.stats).map(([k,v]) => `${STATS_LABEL[k]} ${v}`).join(' & ');
  if (req.type === "book") return `【${req.book}】` + (req.role ? ` (${req.role})` : '');
  return "";
};

// 行動数からSLvを取得する関数 (1~10:SLv0, 11~20:SLv1, 21~29:SLv2, 30~40:SLv3)
const getSLvForTurn = (turn) => {
  if (turn <= 10) return 0;
  if (turn <= 20) return 1;
  if (turn <= 29) return 2;
  return 3;
};

// 特定ターンでスキルが発動条件を満たすかチェックする関数
const checkSkillTrigger = (skill, turn, currentSLv) => {
  if (!skill || !skill.trigger) return false;
  const trigger = skill.trigger;

  // 1. SLv条件の検証
  let reqSLv = 0;
  const slvMatch = trigger.match(/SLv(\d+)以上/);
  if (slvMatch) {
    reqSLv = parseInt(slvMatch[1], 10);
  }
  if (currentSLv < reqSLv) {
    return false;
  }

  // 2. N行動毎（倍数）の検証
  const intervalMatch = trigger.match(/(\d+)行動毎/);
  if (intervalMatch) {
    const interval = parseInt(intervalMatch[1], 10);
    return (turn % interval === 0);
  }

  // 3. 戦闘開始時トリガーは1行動目のみ発動対象
  if (trigger.includes("戦闘開始時")) {
    return turn === 1;
  }

  // 倍数指定のない「通常時」「自分行動前」「ターン開始時」などはSLvを満たしていれば発動可能
  return true;
};

// 1〜40行動のシミュレーションを実行する関数
const runSimulation = () => {
  const simulation = [];
  for (let turn = 1; turn <= 40; turn++) {
    const slv = getSLvForTurn(turn);
    const isSLvUp = (turn === 11 || turn === 21 || turn === 30);
    let triggered = null;

    // セットされているスキル（1枠目〜12枠目の順）を上から順に評価
    for (let idx = 0; idx < equipped.length; idx++) {
      const skill = equipped[idx];
      if (checkSkillTrigger(skill, turn, slv)) {
        triggered = { slot: idx + 1, skill };
        break; // 最初に条件を満たしたスキルが優先発動
      }
    }

    simulation.push({ turn, slv, isSLvUp, triggered });
  }
  return simulation;
};

const getLearnable = () => SKILLS.filter(skill => {
  const r = skill.req || {};
  let matchReq = false;

  if (r.type === "none") matchReq = true;
  else if (r.type === "role") matchReq = (role === r.role && roleLv >= (r.minLv || 1));
  else if (r.type === "stat") matchReq = (stats[r.stat] >= r.val);
  else if (r.type === "multiStat") matchReq = Object.entries(r.stats).every(([k,v]) => stats[k] >= v);
  else if (r.type === "book") matchReq = books.includes(r.book) && (!r.role || r.role === role);

  if (!matchReq) return false;

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase().trim();
    const nameMatch = skill.name.toLowerCase().includes(q);
    const effectMatch = skill.effect.toLowerCase().includes(q);
    const triggerMatch = skill.trigger.toLowerCase().includes(q);
    return nameMatch || effectMatch || triggerMatch;
  }

  return true;
});

function copySimToClipboard(){
  const sim = runSimulation();
  let text = `【1〜40行動 スキル発動シミュレーション】\n`;
  text += `ロール: ${role ? `${role} Lv${roleLv}` : 'なし'} | 装備スキル数: ${equipped.length}/12\n\n`;

  sim.forEach(item => {
    const slvUpStr = item.isSLvUp ? ` [★SLv UP -> SLv${item.slv}]` : ` [SLv${item.slv}]`;
    const mults = [];
    if (item.turn % 4 === 0) mults.push("4倍数");
    if (item.turn % 7 === 0) mults.push("7倍数");
    if (item.turn % 9 === 0) mults.push("9倍数");
    const multStr = mults.length ? ` (${mults.join(', ')})` : "";

    if (item.triggered) {
      text += `${item.turn}行動目${slvUpStr}${multStr}: Slot#${item.triggered.slot} 【${item.triggered.skill.name}】 (${item.triggered.skill.trigger}) -> ${item.triggered.skill.effect}\n`;
    } else {
      text += `${item.turn}行動目${slvUpStr}${multStr}: (発動スキルなし)\n`;
    }
  });

  copyToClipboard(text, "📋 発動シミュレーション結果をコピーしました！");
}

function copyToClipboard(text, successMsg) {
  const tempTextArea = document.createElement("textarea");
  tempTextArea.value = text;
  document.body.appendChild(tempTextArea);
  tempTextArea.select();
  document.execCommand("copy");
  document.body.removeChild(tempTextArea);

  showToast(successMsg);
}

      </div>
      <div class="slots">
        ${Array.from({length:12},(_,i)=>{
          const s=equipped[i];
          const slotCost = SLOT_COSTS[i];
          return s ? `
            <div class="equipped-slot">
              <div class="name-box">
                <span class="name">${esc(s.name)}</span>
                ${slotCost > 0 ? `<span class="slot-cost">+${slotCost} PT</span>` : ''}
              </div>
              <div class="effect">${esc(s.effect)}</div>
              <button class="remove-x" data-remove="${esc(s.name)}" title="解除する">×</button>
            </div>`
            : `<div class="slot">
                <span class="slot-num">SLOT ${i+1}</span>
                <span class="slot-cost-tag ${slotCost > 0 ? 'extra' : ''}">${slotCost > 0 ? `+${slotCost} PT` : '初期枠 (0 PT)'}</span>
               </div>`;
        }).join("")}
      </div>
      <div class="clear">
        <button id="clear-btn" ${equipped.length?"":"disabled"}>×　すべてのスキルを解除</button>
      </div>
    </aside>

    <button class="mobile-summary" id="mobile-summary" aria-label="現在のビルドを確認">📋</button>
  `;

  document.getElementById("role-select").onchange = e => { role = e.target.value; render(); };
  document.getElementById("role-lv-select").onchange = e => { roleLv = parseInt(e.target.value, 10) || 1; render(); };

  const searchEl = document.getElementById("search-input");
  searchEl.oninput = e => { searchQuery = e.target.value; render(); };
  searchEl.focus();
  searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);

  document.querySelectorAll("[data-stat]").forEach(el=>el.onchange=e=>setStat(e.target.dataset.stat,e.target.value));
  document.querySelectorAll("[data-book]").forEach(el=>el.onchange=()=>toggleBook(el.dataset.book));
  document.querySelectorAll("[data-skill]").forEach(el=>el.onclick=()=>toggleSkill(SKILLS.find(s=>s.name===el.dataset.skill)));
  document.querySelectorAll("[data-remove]").forEach(el=>el.onclick=()=>removeSkill(el.dataset.remove));
  document.getElementById("clear-btn").onclick=()=>{equipped=[];render();};
  document.getElementById("summary-btn").onclick=()=>openModal("summary");
  document.getElementById("mobile-summary").onclick=()=>openModal("summary");
}

function skillCard(skill){
  const isEquipped=equipped.some(s=>s.name===skill.name);
  const full=!isEquipped && equipped.length>=12;
  const reqText = formatReqText(skill.req);

  return `
    <div class="skill-card ${isEquipped?"equipped":""}">
      <div>
        <div class="skill-top">
          <div class="skill-name">${esc(skill.name)}</div>
          ${isEquipped ? '<span class="set-badge">✓ 装備中</span>' : `<span class="req-tag">${esc(reqText)}</span>`}
        </div>
        <div class="trigger">${esc(skill.trigger)}</div>
        <div class="effect">${esc(skill.effect)}</div>
      </div>
      <button class="${isEquipped?"remove":"add"}" data-skill="${esc(skill.name)}" ${full?"disabled":""}>
        ${isEquipped ? "外す" : "セットする"}
      </button>
    </div>
  `;
}

function renderModal(){
  const root=document.getElementById("modal-root");
  if(!modalOpen){root.innerHTML="";return;}

  const { statSum, statPt, slotPt, totalPt } = getStatusPointSummary();

  root.innerHTML=`
    <div class="modal-backdrop" id="backdrop">
      <div class="modal">
        <div class="modal-head">
          <h2>☷　ビルド確認＆シミュレーション</h2>
          <button class="close" id="close-modal">×</button>
        </div>
        
        <div class="modal-body">
          <!-- モーダル内タブ選択 -->
          <div class="modal-tabs">
            <button class="tab-btn ${modalTab==='summary'?'active':''}" id="tab-summary-btn">
              📊 ビルド概要
            </button>
            <button class="tab-btn ${modalTab==='simulation'?'active':''}" id="tab-sim-btn">
              ⚡ 行動シミュレーション (1〜40行動)
            </button>
          </div>

          ${modalTab === 'summary' ? renderModalSummary(statSum, statPt, slotPt, totalPt) : renderModalSimulation()}
        </div>

        <div class="modal-foot">
          <button class="btn outline" id="modal-copy-btn">
            ${modalTab === 'summary' ? '📋 ビルド概要をコピー' : '📋 シミュレーション結果をコピー'}
          </button>
          <button class="btn primary" id="close-modal-2">閉じる</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("close-modal").onclick = closeModal;
  document.getElementById("close-modal-2").onclick = closeModal;
  document.getElementById("backdrop").onclick = e => { if(e.target.id === "backdrop") closeModal(); };

  document.getElementById("tab-summary-btn").onclick = () => { modalTab = "summary"; renderModal(); };
  document.getElementById("tab-sim-btn").onclick = () => { modalTab = "simulation"; renderModal(); };

  document.getElementById("modal-copy-btn").onclick = () => {
    if (modalTab === 'summary') {
      copyBuildToClipboard();
    } else {
      copySimToClipboard();
    }
  };
}

function renderModalSummary(statSum, statPt, slotPt, totalPt){
  return `
    <div class="summary-grid">
      <div>
        <div class="summary-box" style="border-left:4px solid var(--indigo);">
          <h3>消費ステータスポイント</h3>
          <div class="row"><span>合計消費ポイント</span><b style="font-size:16px;color:var(--indigo)">${totalPt} PT</b></div>
          <div class="row"><span style="color:var(--slate-600)">ステータス消費 (計${statSum}pt × 3)</span><b>${statPt} PT</b></div>
          <div class="row"><span style="color:var(--slate-600)">スキル枠拡張 (${equipped.length}枠)</span><b>${slotPt} PT</b></div>
        </div>

        <div class="summary-box">
          <h3>ロール / 設定</h3>
          <div class="row"><span>選択ロール</span><span class="tag">${esc(role ? `${role} (Lv${roleLv})` : "未設定")}</span></div>
          <div style="font-size:12px;color:var(--slate-500);margin:14px 0 6px;font-weight:700">有効なスキルブック</div>
          ${books.length ? `<div class="tags">${books.map(b=>`<span class="book-tag">${esc(b)}</span>`).join("")}</div>` : '<span style="font-size:12px;color:var(--slate-400);font-style:italic">選択なし</span>'}
        </div>

        <div class="summary-box">
          <h3>ステータス</h3>
          ${Object.entries(STATS_LABEL).map(([k,l])=>`
            <div class="row"><span style="color:var(--slate-600)">${l}</span><b style="background:var(--slate-100);padding:2px 8px;border-radius:6px">${stats[k]}</b></div>
          `).join("")}
        </div>
      </div>

      <div class="summary-box" style="margin-bottom:0">
        <h3 style="display:flex;justify-content:space-between;align-items:center">
          <span>装備スキル</span>
          <span class="tag">${equipped.length} / 12 枠 (${slotPt} PT)</span>
        </h3>
        ${equipped.length ? `
          <div class="summary-skills">
            ${equipped.map((s, idx)=>`
              <div class="summary-skill">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <b>${esc(s.name)}</b>
                  ${SLOT_COSTS[idx] > 0 ? `<span style="font-size:10px;background:#c7d2fe;color:#3730a3;padding:1px 5px;border-radius:4px;font-weight:700">+${SLOT_COSTS[idx]} PT</span>` : ''}
                </div>
                <div>${esc(s.trigger)}</div>
                <span>${esc(s.effect)}</span>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty" style="padding:40px 10px">スキルが選択されていません</div>`}
      </div>
    </div>
  `;
}

function renderModalSimulation(){
  const simResults = runSimulation();

  return `
    <div>
      <div class="sim-header-info">
        <div>
          <b>発動優先度:</b> 上の枠(1枠目〜)から優先評価 / 行動毎に合致した最初のスキルが発動
        </div>
        <div class="sim-legend">
          <span>SLv区切り:</span>
          <span class="slv-badge slv-0">1〜10行動: SLv0</span>
          <span class="slv-badge slv-1">11〜20行動: SLv1</span>
          <span class="slv-badge slv-2">21〜29行動: SLv2</span>
          <span class="slv-badge slv-3">30〜40行動: SLv3</span>
        </div>
      </div>

      ${!equipped.length ? `
        <div class="empty" style="background:white;padding:50px 20px">
          ⓘ スキルがセットされていません。スキルを装備するとシミュレーションが表示されます。
        </div>
      ` : `
        <div class="sim-table-container">
          <table class="sim-table">
            <thead>
              <tr>
                <th style="width:110px">行動数</th>
                <th style="width:75px">SLv</th>
                <th style="width:180px">発動スキル</th>
                <th style="width:160px">発動条件 (トリガー)</th>
                <th>スキル効果</th>
              </tr>
            </thead>
            <tbody>
              ${simResults.map(item => {
                const is4 = item.turn % 4 === 0;
                const is7 = item.turn % 7 === 0;
                const is9 = item.turn % 9 === 0;

                let rowClass = "sim-row";
                if (item.isSLvUp) rowClass += " slv-up-row";
                if (is4) rowClass += " has-mult-4";
                if (is7) rowClass += " has-mult-7";
                if (is9) rowClass += " has-mult-9";

                return `
                  <tr class="${rowClass}">
                    <td>
                      <b>${item.turn} 行動目</b>
                      ${is4 ? '<span class="mult-badge mult-4">4倍</span>' : ''}
                      ${is7 ? '<span class="mult-badge mult-7">7倍</span>' : ''}
                      ${is9 ? '<span class="mult-badge mult-9">9倍</span>' : ''}
                    </td>
                    <td>
                      <span class="slv-badge slv-${item.slv}">SLv${item.slv}</span>
                      ${item.isSLvUp ? '<span class="slv-up-tag">UP</span>' : ''}
                    </td>
                    <td>
                      ${item.triggered ? `
                        <span class="slot-badge">#${item.triggered.slot}</span>
                        <b style="color:#312e81">${esc(item.triggered.skill.name)}</b>
                      ` : '<span class="no-skill">発動なし</span>'}
                    </td>
                    <td style="color:var(--slate-600);font-size:11px">
                      ${item.triggered ? esc(item.triggered.skill.trigger) : '-'}
                    </td>
                    <td style="color:var(--slate-700)">
                      ${item.triggered ? esc(item.triggered.skill.effect) : '-'}
                    </td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

window.onload = function() {
  render();
  updatePointCard();
  setInterval(updatePointCard, 1000);
};
</script>
</body>
</html>
